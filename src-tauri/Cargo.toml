[package]
name = "cursorforge"
version = "1.27.0"
description = "Your pointer. Possessed."
authors = ["feylo"]
license = "MIT"
repository = "https://github.com/notfeylo/cursed"
edition = "2021"
rust-version = "1.82"
# Two binaries live here - the app, and the build-time catalog generator - and
# `cargo run` refuses to guess between them. `tauri dev` runs `cargo run`, so
# without this the whole dev loop stops at "could not determine which binary to
# run" before the window ever opens. `tauri build` was unaffected, which is why
# it went unnoticed: releases are built, not run.
default-run = "cursorforge"

[lib]
name = "cursorforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cursorforge"
path = "src/main.rs"

# Build-time catalog generator: parametric SVG masters -> multi-resolution .cur.
# Shares the exact byte writers that ship at runtime, so what we test is what we ship.
[[bin]]
name = "genpacks"
path = "src/bin/genpacks.rs"

# The dev channel: a second install that sits beside the shipped one without
# either corrupting the other's state. Off by default, because the default is
# what ships — a release is built by adding nothing, not by remembering to leave
# something out. See `src/channel.rs`, and the guard in `scripts/check-bundle.mjs`
# that fails any release artifact carrying the dev marker.
[features]
default = []
dev-channel = []

# The offline installer bundles the WebView2 runtime for air-gapped machines.
# Photo mode is the one feature that cannot work there, because it is defined by
# fetching something, so it is compiled out rather than offered and failed.
offline-build = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Only the decoders this app can actually be handed. `tiff` is here because the
# file picker has always offered it: a filter that lists a format the decoder
# refuses is a dialog that lets somebody choose a file and then calls it
# unreadable. `.cur`, `.ani` and `.ico` are read by `build::icon_reader`
# instead - this crate has no decoder for a cursor container.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "bmp",
    "gif",
    "tiff",
] }
fast_image_resize = { version = "5", features = ["image"] }
resvg = { version = "0.45", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
minisign-verify = "0.2.5"
ort = { version = "2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Note: `tauri-plugin-updater` is deliberately absent. It pulls reqwest+rustls
# (~2 MB of binary) for a feature that, unsigned, cannot verify anything useful
# yet. Until code signing is in place the update check is a WinHTTP request to
# the GitHub Releases API — OS trust store, no extra dependency, no false sense
# of integrity (PRD §13.7).

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
