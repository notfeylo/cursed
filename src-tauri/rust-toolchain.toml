# Pinned so a release built here and a release built in CI come from the same
# compiler. Bump deliberately, in its own commit.
[toolchain]
channel = "1.96"
components = ["clippy", "rustfmt"]
# Every architecture a release ships an installer for. Declared here rather than
# installed by hand: `rustup target add` adds to whatever toolchain is *default*,
# not to this pinned one, and the build then fails with "can't find crate for
# `std`" against a target rustup cheerfully reports as installed.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "i686-pc-windows-msvc",
]
profile = "minimal"
