name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          if [[ "$tag" != "$app" ]]; then
            echo "::error::tag $tag does not match package.json version $app"
            exit 1
          fi

      # The signing key must exist before anything is built with it.
      #
      # Checked here rather than at the end, because the failure this prevents is
      # a release that goes out *without* a signature: every copy of the app that
      # installs it then has no key compiled in, and the fleet loses the ability
      # to verify updates until the next release — including the release that
      # would fix it. A missing secret has to stop the run, not degrade it.
      #
      # `docs/SIGNING.md` has the one command that produces the pair and where
      # each half goes.
      - name: The release signing key is available
        shell: bash
        env:
          PUBLIC_KEY: ${{ secrets.CURSED_UPDATE_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=0
          if [[ -z "${PUBLIC_KEY// }" ]]; then
            echo "::error::secret CURSED_UPDATE_PUBLIC_KEY is not set -- see docs/SIGNING.md"
            missing=1
          fi
          if [[ -z "${PRIVATE_KEY// }" ]]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is not set -- see docs/SIGNING.md"
            missing=1
          fi
          exit $missing

      # Existing and being correct are different things.
      #
      # Signing is the last step of a twenty-five minute build, so a wrong
      # password costs a full build to discover and another to confirm the fix.
      # This signs eight bytes and exits. It is thirty seconds, and it is the
      # difference between a mistake in a secret costing a minute and costing an
      # hour — which is not hypothetical: it cost an hour.
      - name: The signing key actually signs, and its public half matches
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Checked here as well as compiled in below. A public key that is not
          # the other half of the signing key produces a release that signs,
          # publishes, and is then refused by every installed copy for ever.
          CURSED_UPDATE_PUBLIC_KEY: ${{ secrets.CURSED_UPDATE_PUBLIC_KEY }}
        run: node scripts/sign-release.mjs --selftest

      # Builds x64, ARM64 and 32-bit, plus the x64 offline installer, stages them
      # with an unversioned alias each, and writes SHA256SUMS.txt. Running the
      # same script CI runs is the point: a release built by hand on one machine
      # is a release nobody else can reproduce.
      #
      # The *installers* are unsigned until Azure Trusted Signing is in place
      # (PRD §13.7), which is what SmartScreen looks at. The signature added
      # below is a different thing for a different job: it is what the updater
      # checks before running a download, and it is free.
      - name: Build every installer
        env:
          # Stamped into Settings → About, so a bug report names an exact build.
          CURSED_COMMIT: ${{ github.sha }}
          # Compiled into the binary, so the copy a user installs can verify the
          # *next* update. A public key in a public binary is what a public key
          # is for.
          CURSED_UPDATE_PUBLIC_KEY: ${{ secrets.CURSED_UPDATE_PUBLIC_KEY }}
        run: npm run release

      # Signed after staging, so every file the release publishes is covered —
      # including the unversioned aliases, which are the ones the website links.
      - name: Sign every artifact
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/sign-release.mjs

      - name: Every architecture is present
        shell: bash
        run: |
          # A missing target does not fail the build above — it fails by simply
          # not being there, and the release then quietly ships one fewer
          # architecture than the website offers.
          missing=0
          for f in Cursed-Setup.exe Cursed-Setup-ARM64.exe Cursed-Setup-x86.exe \
                   Cursed-Setup-Offline-x64.exe SHA256SUMS.txt; do
            if [[ ! -f "dist-release/$f" ]]; then
              echo "::error::dist-release/$f was not produced"
              missing=1
            fi
          done
          # Every installer the updater can choose must carry a signature, or a
          # signed build refuses the update and reports it as tampering.
          for f in dist-release/Cursed_*-setup.exe; do
            if [[ ! -f "$f.minisig" ]]; then
              echo "::error::$f has no signature beside it"
              missing=1
            fi
          done
          ls -la dist-release
          exit $missing

      # Whether this tag has already been released by hand.
      #
      # This guard exists because the step below would otherwise **unpublish a
      # live release**. `action-gh-release` finds the release for the tag and
      # patches it with the inputs given here — including `draft: true` — so a
      # tag that was already published by hand comes back as a draft. GitHub's
      # `releases/latest` does not return drafts, so every installed copy of the
      # app would silently start comparing itself against the *previous*
      # release: anyone on the newest version is told they are up to date
      # forever, and everyone else is offered a downgrade. Nothing in the app
      # can detect that, because from its side the answer looks legitimate.
      #
      # The run has been cancelled by hand at each of the last two releases for
      # exactly this reason. A race that has to be won manually every time is
      # not a race that stays won.
      - name: Has this tag already been released?
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is already published; leaving it exactly as it is."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: steps.existing.outputs.published != 'true'
        with:
          files: dist-release/*
          draft: true
          generate_release_notes: true
          body: |
            ### Install

            Download **`Cursed-Setup.exe`** and double-click it. Per-user
            install, no administrator prompt.

            | Build | For |
            | --- | --- |
            | `Cursed-Setup.exe` | Almost every PC (x64) |
            | `Cursed-Setup-ARM64.exe` | Snapdragon, Copilot+, Surface Pro X — native rather than emulated |
            | `Cursed-Setup-x86.exe` | Older PCs running 32-bit Windows |
            | `Cursed-Setup-Offline-x64.exe` | No internet, or a network that blocks Microsoft's download. ~272 MiB — only take it if you need it. |

            Requires **Windows 10 version 1803 or newer**. The app updates
            itself to the architecture it is already running.

            The installers are **not code-signed**, so Windows SmartScreen will
            warn on first run. Verify your download against `SHA256SUMS.txt`.

            Each installer also ships a `.minisig` beside it. The app checks that
            signature against a key compiled into it before it runs an update, so
            a release nobody could have signed is a release no installed copy
            will execute.
