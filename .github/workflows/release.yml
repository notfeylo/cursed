name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Verify the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./package.json').version")
          if [[ "$tag" != "$app" ]]; then
            echo "::error::tag $tag does not match package.json version $app"
            exit 1
          fi

      - name: Build
        env:
          # Stamped into Settings → About, so a bug report names an exact build.
          CURSORFORGE_COMMIT: ${{ github.sha }}
        run: npm run tauri build

      # Unsigned until Azure Trusted Signing is in place (PRD §13.7). Publishing
      # checksums is what lets someone verify a download in the meantime.
      - name: Checksums
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \( -name '*-setup.exe' -o -name '*.msi' \) \
            -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          body: |
            ### Install

            Download the `-setup.exe` and double-click it. Per-user install, no
            administrator prompt.

            This build is **unsigned**, so Windows SmartScreen will warn on first
            run. Verify your download against `SHA256SUMS.txt`.
