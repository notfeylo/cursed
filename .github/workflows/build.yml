name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The validation workflow only needs to read the checkout. Keep the automatic
# token read-only even if the repository default changes later.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # TypeScript strict, zero `any`, plus the production bundle.
      - name: Frontend
        run: npm run build

      # `working-directory` rather than `--manifest-path`, here and everywhere
      # else cargo is called: rustup picks a toolchain from the *current
      # directory*, and rust-toolchain.toml lives in src-tauri/. Called from the
      # repo root, cargo runs on whatever `stable` the runner happens to have —
      # which is not the compiler that builds a release, and is how the
      # cross-arch job below spent four pushes failing to find `std`.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      # The two channels are #[cfg]-gated constants, so the run above never
      # compiles the dev channel's code or the assertions holding it apart from
      # the shipped one — a dev build that cannot compile would otherwise be
      # found by the developer who needed it, months later.
      - name: Dev channel
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --features dev-channel -- -D warnings
          cargo test --features dev-channel

      # Every pack must define all 17 roles; this fails the build if one doesn't.
      #
      # The path is relative to the working directory, which is the repo root.
      # It said `../assets/packs` until 1.18.0, which wrote a sibling of the
      # checkout — so the step below compared a directory nothing had touched
      # and passed for months without ever checking anything.
      - name: Catalog
        run: cargo run --manifest-path src-tauri/Cargo.toml --bin genpacks -- assets/packs

      - name: Catalog is committed and current
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain assets/packs)" ]]; then
            echo "::error::assets/packs is out of date — run 'npm run generate:packs' and commit."
            git --no-pager diff --stat assets/packs
            exit 1
          fi

      - name: Build the installer
        run: npm run tauri build

      # Three failures that are invisible by design: a font subset carrying no
      # Latin glyphs, which silently renders in a fallback face; an unused font
      # reaching the installer because an emitted stylesheet is never
      # tree-shaken; and a dev-channel binary about to ship as the release. Also
      # asserts the dev-only specimen route is absent.
      #
      # After the build, not before. The first two checks only need `dist/`, but
      # the channel marker is read out of the compiled `.exe` — run earlier, it
      # finds no binaries and vouches for nothing.
      - name: Bundle contents
        run: npm run check:bundle

      - name: Installer size budget
        shell: bash
        run: |
          # PRD §12: under 12 MB is the target, over 25 MB is a hard failure.
          setup=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n1)
          bytes=$(stat -c%s "$setup")
          mb=$((bytes / 1048576))
          echo "installer: ${mb} MB ($setup)"
          if (( bytes > 25 * 1048576 )); then
            echo "::error::installer is ${mb} MB, over the 25 MB hard limit"
            exit 1
          fi
          if (( bytes > 12 * 1048576 )); then
            echo "::warning::installer is ${mb} MB, over the 12 MB target"
          fi

      # NSIS only, because that is the only thing that ships.
      #
      # An MSI was built and uploaded here for months. It was never attached to
      # a release and the updater could never have chosen one — `is_our_installer`
      # only accepts `Cursed_<version>_<arch>-setup.exe` — but it was one
      # download away from a user installing it by hand. NSIS installs per-user
      # to %LOCALAPPDATA%; an MSI would have gone to its own default location
      # under its own uninstall entry, because the two record the install
      # directory under different registry values and neither finds the other's.
      # The result is two copies of Cursed and two uninstallers, which is the
      # duplicate-install failure the update research brief opens with.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cursed-installers
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # Releases ship x64, ARM64 and 32-bit. Only the host architecture is built
  # above, so without this an arch-specific break — a pointer-width assumption,
  # an intrinsic that is x86-only — stays invisible until release day, where it
  # surfaces as one silently missing installer.
  #
  # Clippy per target rather than a full build: it type-checks and lints the
  # whole tree for that architecture in a fraction of the time, and linking is
  # not the thing at risk here.
  cross-arch:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `with: targets:` on purpose. src-tauri/rust-toolchain.toml pins the
      # toolchain and lists every target, and rustup installs them from there.
      # Adding one to a toolchain the build does not use is how you get "can't
      # find crate for `std`" against a target rustup reports as installed.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # From src-tauri, so rustup reads rust-toolchain.toml and installs the
      # pinned toolchain *with* its target list. Run from the repo root with
      # `--manifest-path`, the toolchain file is never seen, aarch64 std is
      # missing, and the job fails with E0463 — which is the same trap the
      # comment above warns about, arrived at from the other direction.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --target ${{ matrix.target }} --all-targets -- -D warnings

  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - run: npm ci

      # Build fails on a high or critical advisory (PRD §13.7).
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

      # Fails on an actual advisory. Deliberately NOT `--deny warnings`: the
      # dependency tree carries ~17 unmaintained/unsound notices for GTK and
      # GLib crates, which Tauri pulls in for Linux and which never compile into
      # a Windows build. Failing on those would train everyone to ignore this
      # job, which is worse than not running it.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny --manifest-path src-tauri/Cargo.toml check licenses bans
